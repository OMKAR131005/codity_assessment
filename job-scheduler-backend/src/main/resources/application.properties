

spring.application.name=job-scheduler

# ==== Database (MySQL) ====
# Create the DB first: CREATE DATABASE jobscheduler;
spring.datasource.url=jdbc:mysql://localhost:3306/jobscheduler?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

server.port=${SERVER_PORT:8090}

# ==== JWT ====
# Generate your own secret for real use — this default is fine for local dev only.
jwt.secret=${JWT_SECRET:ThisIsA256BitSecretKeyForJWTSigningChangeInProdEnvironment123456}
jwt.expiration-ms=86400000

# ==== Worker ====
worker.poll.batch-size=10
worker.thread-pool.size=10
worker.heartbeat.stale-threshold-seconds=30

logging.level.com.jobscheduler=INFO

# ---
# Required environment variables before running:
#   DB_PASSWORD   — your local MySQL password (required, no default on purpose)
#   DB_USERNAME   — defaults to "root" if not set
#   SERVER_PORT   — defaults to 8090 if not set
#   JWT_SECRET    — has a dev-only default; set your own for anything beyond local dev
